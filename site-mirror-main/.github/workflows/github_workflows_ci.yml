name: CI - Node 22 / pnpm

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master, develop ]

jobs:
  test:
    name: Test on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm' # enables pnpm cache

      - name: Enable Corepack & prepare pnpm
        run: |
          corepack enable
          corepack prepare pnpm@latest --activate

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm -w build --if-present

      - name: Lint
        run: pnpm -w lint --if-present

      - name: Test
        run: pnpm -w test --if-present

      - name: Upload test artifacts (if any)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-logs
          path: test-results || ./logs || ./coverage || ./npm-debug.log
